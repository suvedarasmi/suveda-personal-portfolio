
name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  html-title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML title
        run: |
          if ! grep -Eiq '<title[^>]*>[^<]+</title>' index.html; then
            echo "HTML title is missing"
            exit 1
          fi
          echo "HTML title check passed"

  image-alt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check image alt attributes
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser

          class ImageChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      attributes = dict(attrs)
                      if "alt" not in attributes:
                          self.errors.append("Image missing alt attribute")

          checker = ImageChecker()

          with open("index.html", encoding="utf-8") as file:
              checker.feed(file.read())

          if checker.errors:
              for error in checker.errors:
                  print(error)
              raise SystemExit(1)

          print("Image alt check passed")
          PY

  javascript-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for console.log
        run: |
          if grep -n "console.log" js/*.js; then
            echo "Remove console.log statements"
            exit 1
          fi
          echo "JavaScript check passed"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs:
      - html-title-check
      - image-alt-check
      - javascript-check
    steps:
      - name: Confirm all checks
        run: echo "All pull request checks passed!"
